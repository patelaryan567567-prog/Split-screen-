name: Build SplitMe APK

on:
  workflow_dispatch:
  push:
    paths:
      - "extracted/splitme-master/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Make Gradle wrapper executable
        working-directory: extracted/splitme-master
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: extracted/splitme-master
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitMe-Modern-debug-apk
          path: extracted/splitme-master/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
