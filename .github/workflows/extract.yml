name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZIP
        run: curl -fL -o SplitMe-Modern-source.zip https://github.com/patelaryan567567-prog/Split-screen-/raw/main/SplitMe-Modern-source.zip

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o SplitMe-Modern-source.zip -d extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          git commit -m "Extract SplitMe source ZIP" || echo "No changes to commit"
          git push
